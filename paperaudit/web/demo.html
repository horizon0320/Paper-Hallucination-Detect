<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tele paper audit</title>
  <style>
    :root{--ink:#102a43;--muted:#627d98;--line:#d9e2ec;--paper:#fff;--bg:#f4f7f9;--accent:#0f766e;--accent-2:#14b8a6;--soft:#e8f8f5;--shadow:0 18px 50px rgba(16,42,67,.10)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    main{max-width:900px;margin:0 auto;padding:42px 22px 64px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:34px}.eyebrow{color:var(--accent);font-weight:850;letter-spacing:.16em;text-transform:uppercase;font-size:.75rem}.top h1{margin:9px 0 0;font-size:clamp(2.6rem,6vw,4.8rem);line-height:.98;letter-spacing:-.065em}.local{color:var(--muted);font-size:.82rem;text-align:right;white-space:nowrap}.workspace{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.drop{border:1.5px dashed #91c9c1;border-radius:17px;background:linear-gradient(135deg,#f8fffe,#edf9f7);padding:42px 24px;text-align:center;cursor:pointer}.drop:hover,.drop.drag{background:var(--soft);border-color:var(--accent)}.drop h2{margin:10px 0 5px;font-size:1.28rem}.drop p{margin:0;color:var(--muted)}.file-icon{width:48px;height:58px;margin:auto;position:relative;color:var(--accent)}.file-icon:before{content:"";position:absolute;inset:0;border:2px solid currentColor;border-radius:7px}.file-icon:after{content:"PDF";position:absolute;left:6px;right:6px;bottom:12px;border-top:2px solid currentColor;padding-top:4px;font-size:10px;font-weight:850}.choose{margin-top:19px;border:0;border-radius:10px;background:var(--ink);color:#fff;padding:11px 18px;font:inherit;font-weight:750;cursor:pointer}.choose:hover{background:#1f4b68}input{display:none}.selection{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);align-items:center;justify-content:space-between;gap:15px}.selection.show{display:flex}.filename{font-weight:800;overflow-wrap:anywhere}.filesize{color:var(--muted);font-size:.86rem}.start{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}.start:disabled{opacity:.45;cursor:not-allowed}.progress{display:none;border-top:1px solid var(--line);margin-top:28px;padding-top:25px}.progress.show{display:block}.progress-head{display:flex;justify-content:space-between;align-items:baseline}.progress-head h3{margin:0;font-size:1.1rem}.percent{color:var(--accent);font-weight:850;font-variant-numeric:tabular-nums}.track{height:11px;background:#e6edf2;border-radius:20px;overflow:hidden;margin:15px 0 11px}.bar{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .2s ease}.status{color:var(--muted);min-height:25px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.step{color:#a1b3c5;font-size:.82rem;display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#cbd5df}.step.active{color:var(--accent);font-weight:750}.step.active .dot{background:var(--accent)}.report{display:none;margin-top:24px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.report.show{display:block}.report-title{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:800;background:#f7fafc}.report-frame{display:block;width:100%;height:min(82vh,980px);border:0}@media(max-width:640px){main{padding:28px 14px 48px}.top{display:block}.local{text-align:left;margin-top:16px}.workspace{padding:17px}.selection{align-items:stretch;flex-direction:column}.start{width:100%}.steps{grid-template-columns:1fr}.report-frame{height:75vh}}
  </style>
</head>
<body>
<main>
  <div class="top"><div><div class="eyebrow">Tele paper audit</div><h1>Tele paper audit</h1></div><div class="local">仅监听<br><b>127.0.0.1:8765</b></div></div>
  <section class="workspace">
    <div id="drop" class="drop"><div class="file-icon"></div><h2>拖入 PDF，或选择文件</h2><p>支持论文 PDF · 默认关闭 URL 和 LLM 检查</p><button id="choose" class="choose" type="button">选择 PDF</button><input id="file" type="file" accept="application/pdf,.pdf"></div>
    <div id="selection" class="selection"><div><div id="filename" class="filename"></div><div id="filesize" class="filesize"></div></div><button id="start" class="start" type="button" disabled>开始验证</button></div>
    <div id="progress" class="progress"><div class="progress-head"><h3>正在生成验证报告</h3><div id="percent" class="percent">0%</div></div><div class="track"><div id="bar" class="bar"></div></div><div id="status" class="status">准备中…</div><div class="steps"><div id="parse" class="step"><span class="dot"></span>解析 PDF</div><div id="verify" class="step"><span class="dot"></span>多源验证</div><div id="render" class="step"><span class="dot"></span>生成 HTML</div></div><div id="report" class="report"><div class="report-title">验证报告</div><iframe class="report-frame" title="Paper-audit 验证报告" src="about:blank"></iframe></div></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s),API_BASE=location.protocol==='file:'?'http://127.0.0.1:8765':'',REPORT='/reports/ICLR_hallu_submission_TamperTok_Forensics_Driv_paperaudit_basic_report.html';let chosen=null,running=false;
const drop=$('#drop'),file=$('#file'),selection=$('#selection'),start=$('#start');
$('#choose').onclick=e=>{e.stopPropagation();file.click()};drop.onclick=()=>file.click();
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)select(f)});file.onchange=()=>{if(file.files[0])select(file.files[0])};
function select(f){if(!f.name.toLowerCase().endsWith('.pdf'))return;chosen=f;$('#filename').textContent=f.name;$('#filesize').textContent=(f.size/1024/1024).toFixed(2)+' MB';selection.classList.add('show');start.disabled=false}
start.onclick=()=>{if(!chosen||running)return;running=true;start.disabled=true;$('#progress').classList.add('show');$('#report').classList.remove('show');const steps=[['parse',0,24,'正在解析 PDF…'],['verify',24,84,'正在进行多源验证…'],['render',84,100,'正在生成 HTML 报告…']];let step=0,n=0;const tick=()=>{const s=steps[step];n=Math.min(s[2],n+1);set(n,s[3]);if(n>=s[2]&&step<steps.length-1){step++;}if(n<100){setTimeout(tick,95)}else{setTimeout(()=>{const report=$('#report');report.classList.add('show');report.querySelector('iframe').src=API_BASE+REPORT;report.scrollIntoView({behavior:'smooth',block:'start'});$('#status').textContent='验证完成';running=false},320)}};set(0,'正在上传 PDF…');setTimeout(tick,500)};
function set(n,msg){$('#bar').style.width=n+'%';$('#percent').textContent=n+'%';$('#status').textContent=msg;[['parse',24],['verify',84],['render',100]].forEach(([id,end])=>{if(n>=end)$('#'+id).classList.add('active')})}
</script>
</body>
</html>
