<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper-audit · PDF 验证</title>
  <style>
    :root{--ink:#102a43;--muted:#627d98;--line:#d9e2ec;--paper:#fff;--bg:#f4f7f9;--accent:#0f766e;--accent-2:#14b8a6;--accent-soft:#dff7f3;--orange:#d97706;--shadow:0 18px 50px rgba(16,42,67,.10)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    main{max-width:900px;margin:0 auto;padding:46px 22px 70px}.eyebrow{letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800;font-size:.75rem}.top{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:36px}.top h1{font-size:clamp(2rem,5vw,3.7rem);line-height:1.03;letter-spacing:-.055em;margin:8px 0 12px}.top p{max-width:560px;margin:0;color:var(--muted);font-size:1.02rem}.local{color:var(--muted);font-size:.82rem;text-align:right;white-space:nowrap}.workspace{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:28px;border-radius:22px}.drop{border:1.5px dashed #94c9c1;background:linear-gradient(135deg,#f7fffd,#edf9f7);border-radius:17px;padding:38px 24px;text-align:center;transition:.2s ease;cursor:pointer}.drop.drag{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}.drop h2{margin:8px 0 6px;font-size:1.25rem}.drop p{margin:0;color:var(--muted)}.file-icon{width:48px;height:58px;margin:0 auto;color:var(--accent);position:relative}.file-icon:before{content:"";position:absolute;inset:0;border:2px solid currentColor;border-radius:7px}.file-icon:after{content:"PDF";position:absolute;left:6px;right:6px;bottom:12px;border-top:2px solid currentColor;padding-top:4px;font-size:10px;font-weight:800}.choose{margin-top:20px;border:0;border-radius:10px;background:var(--ink);color:#fff;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}.choose:hover{background:#1f4b68}input{display:none}.selection{display:none;margin-top:18px;border-top:1px solid var(--line);padding-top:18px;align-items:center;justify-content:space-between;gap:14px}.selection.show{display:flex}.filename{font-weight:750;overflow-wrap:anywhere}.filesize{font-size:.85rem;color:var(--muted)}.start{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}.start:disabled{opacity:.45;cursor:not-allowed}.start:not(:disabled):hover{background:#0b5f59}.progress-panel{display:none;margin-top:28px;padding-top:26px;border-top:1px solid var(--line)}.progress-panel.show{display:block}.progress-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px}.progress-head h3{margin:0;font-size:1.1rem}.percent{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:850}.track{height:11px;background:#e6edf2;border-radius:20px;overflow:hidden;margin:15px 0 12px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:inherit;transition:width .35s ease}.status{color:var(--muted);min-height:24px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:19px}.step{font-size:.8rem;color:#9fb3c8;display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#cbd5df}.step.active{color:var(--accent);font-weight:700}.step.active .dot{background:var(--accent)}.result{display:none;margin-top:24px;padding:18px;background:#f4fbf9;border:1px solid #b9e3db;border-radius:13px}.result.show{display:block}.result strong{display:block;font-size:1.08rem}.report-link{display:inline-block;margin-top:11px;color:var(--accent);font-weight:800;text-decoration:none}.report-link:hover{text-decoration:underline}.error{display:none;margin-top:18px;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px}.error.show{display:block}@media(max-width:640px){main{padding:28px 14px 50px}.top{display:block}.local{text-align:left;margin-top:15px}.workspace{padding:17px;border-radius:17px}.selection{align-items:stretch;flex-direction:column}.start{width:100%}.steps{grid-template-columns:1fr;gap:5px}}
  </style>
  <style>
    .report-preview{display:none;margin-top:20px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 10px 28px rgba(16,42,67,.08)}
    .report-preview.show{display:block}.report-preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;background:#f7fafc;border-bottom:1px solid var(--line);font-weight:800}.report-preview-head span{font-size:.8rem;color:var(--muted);font-weight:500}.report-frame{display:block;width:100%;height:min(82vh,980px);border:0;background:#fff}
    @media(max-width:640px){.report-frame{height:75vh}}
  </style>
</head>
<body>
<main>
  <div class="top"><div><div class="eyebrow">Tele paper audit</div><h1>Tele paper audit</h1></div><div class="local">仅监听<br><b>127.0.0.1:8765</b></div></div>
  <section class="workspace">
    <div id="drop" class="drop"><div class="file-icon"></div><h2>拖入 PDF，或选择文件</h2><p>支持论文 PDF · 默认关闭 URL 和 LLM 检查</p><button id="choose" class="choose" type="button">选择 PDF</button><input id="file" type="file" accept="application/pdf,.pdf"></div>
    <div id="selection" class="selection"><div><div id="filename" class="filename"></div><div id="filesize" class="filesize"></div></div><button id="start" class="start" type="button" disabled>开始验证</button></div>
    <div id="progressPanel" class="progress-panel"><div class="progress-head"><h3>正在生成验证报告</h3><div id="percent" class="percent">0%</div></div><div class="track"><div id="bar" class="bar"></div></div><div id="status" class="status">准备中…</div><div class="steps"><div id="stepParse" class="step"><span class="dot"></span>解析 PDF</div><div id="stepVerify" class="step"><span class="dot"></span>多源验证</div><div id="stepReport" class="step"><span class="dot"></span>生成 HTML</div></div><div id="result" class="result"><strong>报告已生成</strong><a id="reportLink" class="report-link" target="_blank" rel="noopener">打开 HTML 报告 →</a></div><div id="error" class="error"></div></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);let selected=null,jobId=null,timer=null;
const drop=$('#drop'),file=$('#file'),selection=$('#selection'),start=$('#start');
$('#choose').onclick=e=>{e.stopPropagation();file.click()};drop.onclick=()=>file.click();
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)select(f)});file.onchange=()=>{if(file.files[0])select(file.files[0])};
function select(f){if(!f.name.toLowerCase().endsWith('.pdf'))return showError('请选择 PDF 文件');selected=f;$('#filename').textContent=f.name;$('#filesize').textContent=(f.size/1024/1024).toFixed(2)+' MB';selection.classList.add('show');start.disabled=false;hideError()}
start.onclick=async()=>{if(!selected)return;start.disabled=true;$('#progressPanel').classList.add('show');$('#result').classList.remove('show');hideError();setProgress(0,'正在上传 PDF…');const body=new FormData();body.append('file',selected);try{const r=await fetch('/api/check',{method:'POST',body});const j=await r.json();if(!r.ok)throw Error(j.error||'上传失败');jobId=j.job_id;poll()}catch(e){showError(e.message);start.disabled=false}};
async function poll(){const r=await fetch('/api/jobs/'+jobId);const j=await r.json();if(j.progress!=null)setProgress(j.progress,j.message||'处理中…');setSteps(j.phase);if(j.phase==='done'){$('#result').classList.add('show');$('#reportLink').href='#reportPreview';$('#reportLink').textContent='查看报告 ↓';$('#reportLink').removeAttribute('target');let preview=$('#reportPreview');if(!preview){preview=document.createElement('div');preview.id='reportPreview';preview.className='report-preview';preview.innerHTML='<div class="report-preview-head">验证报告预览</div><iframe id="reportFrame" class="report-frame" title="Paper-audit 验证报告"></iframe>';$('#result').after(preview)}preview.classList.add('show');$('#reportFrame').src=j.report_url;preview.scrollIntoView({behavior:'smooth',block:'start'});return}if(j.phase==='error'){showError(j.error||j.message||'验证失败');start.disabled=false;return}timer=setTimeout(poll,650)}
function setProgress(n,msg){$('#bar').style.width=n+'%';$('#percent').textContent=n+'%';$('#status').textContent=msg}function setSteps(p){[['stepParse','parse'],['stepVerify','verify'],['stepReport','done']].forEach(([id,key])=>{if(p===key||((p==='verify'||p==='done')&&key==='parse')||(p==='done'&&key==='verify'))$('#'+id).classList.add('active')})}function showError(t){$('#error').textContent=t;$('#error').classList.add('show')}function hideError(){$('#error').classList.remove('show')}
</script>
</body>
</html>
