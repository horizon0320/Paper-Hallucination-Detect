[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperaudit"
version = "0.5.0"
description = "Citation verification tool for scholarly reference existence and metadata"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "rapidfuzz>=3",
    "bibtexparser>=1.4",
    "rispy>=0.9",
    "pdfminer.six>=20221105",
    "platformdirs>=4",
    "pymupdf>=1.27.2.3",
]

[project.optional-dependencies]
pdf = ["refextract"]
marker = ["marker-pdf"]
domain = []
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
paperaudit = "paperaudit.cli:app"

[tool.hatch.build.targets.wheel]
# The report renderer is imported by ``paperaudit check --format html`` and
# must therefore be present in installed (non-editable) builds as well.
include = ["paperaudit/**", "tools_generate_report.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
